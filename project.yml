name: ZendureMonitor
options:
  bundleIdPrefix: fr.lauriat
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: "5.9"
targets:
  ZendureMonitor:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleName: ZendureMonitor
        CFBundleDisplayName: Zendure Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: Zendure Monitor communique avec votre batterie SolarFlow sur le réseau local pour lire la production solaire.
        NSBonjourServices:
          - _zendure._tcp
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SUFeedURL: https://raw.githubusercontent.com/vincentlauriat/ZendureMonitor/main/appcast.xml
        SUPublicEDKey: 14HExMrwENK/Pg8quUbjfXG1szAT3ojoOGPLBgpgx2g=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.ZendureMonitor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
