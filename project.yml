name: ZendureMonitor
options:
  bundleIdPrefix: fr.lauriat
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1
settings:
  base:
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: 7
    SWIFT_VERSION: "5.9"
targets:
  ZendureMonitor:
    type: application
    platform: macOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: Sparkle
      - target: ZendureWidget
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDevelopmentRegion: fr
        CFBundleName: ZendureMonitor
        CFBundleDisplayName: Zendure Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: Zendure Monitor communique avec votre batterie SolarFlow sur le réseau local pour lire la production solaire.
        NSLocationUsageDescription: Utilisée une seule fois pour préremplir la position du module Soleil (lever/coucher du soleil). Jamais transmise.
        NSLocationWhenInUseUsageDescription: Utilisée une seule fois pour préremplir la position du module Soleil (lever/coucher du soleil). Jamais transmise.
        NSBonjourServices:
          - _zendure._tcp
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SUFeedURL: https://raw.githubusercontent.com/vincentlauriat/ZendureMonitor/main/appcast.xml
        SUPublicEDKey: 14HExMrwENK/Pg8quUbjfXG1szAT3ojoOGPLBgpgx2g=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.ZendureMonitor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ZendureMonitor.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - ZendureMonitorTests

  # Tests unitaires sans host app : compilent directement les sources pures
  # (parser, éphémérides, formatage) — rapides et exécutables en CI.
  ZendureMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/DeviceState.swift
      - path: Sources/Shared/SunCalc.swift
      - path: Sources/Shared/Format.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.ZendureMonitorTests

  # L'extension widget est obligatoirement sandboxée (contrainte macOS) alors
  # que l'app ne l'est pas : elle ne parle pas au SolarFlow elle-même, elle
  # relit l'instantané que l'app dépose dans le conteneur App Group partagé.
  ZendureWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Localizable.xcstrings
      - path: ZendureWidget
        excludes:
          - "**/*.entitlements"
    info:
      path: ZendureWidget/Info.plist
      properties:
        CFBundleDevelopmentRegion: fr
        CFBundleDisplayName: Zendure Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: ZendureWidget
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.ZendureMonitor.widget
        CODE_SIGN_ENTITLEMENTS: ZendureWidget/ZendureWidget.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
